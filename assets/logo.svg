<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Al-Qamar Islamic Research Institute logo</title>
  <desc id="desc">Circular green institute mark with crescent and Arabic text style.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#286a55"/>
      <stop offset="1" stop-color="#0b3d2f"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001b14" flood-opacity=".35"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="112" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="120" cy="120" r="101" fill="none" stroke="#e7f4ee" stroke-width="3"/>
  <circle cx="120" cy="120" r="83" fill="none" stroke="#98d7c4" stroke-width="1.5" opacity=".9"/>
  <path d="M105 56c-29 16-48 49-43 83 6 39 39 69 78 72-13 8-29 11-45 8-44-7-76-46-70-91 5-39 38-69 80-72z" fill="#f7fbf9"/>
  <path d="M112 72c-20 14-31 38-28 62 4 29 26 53 54 60-31-1-59-25-64-58-4-28 11-55 38-64z" fill="#dceee8"/>
  <text x="120" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#40b6d8">القمر</text>
  <text x="120" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f5fff9">اسلامک ریسرچ انسٹی ٹیوٹ</text>
  <text x="120" y="151" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f5fff9">۲۰۱۱</text>
  <path id="topArc" d="M43 121a77 77 0 0 1 154 0" fill="none"/>
  <path id="bottomArc" d="M197 121a77 77 0 0 1-154 0" fill="none"/>
  <text font-family="Georgia, serif" font-size="8.5" letter-spacing="1.2" fill="#f5fff9">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">AL-QAMAR ISLAMIC RESEARCH INSTITUTE</textPath>
  </text>
  <text font-family="Georgia, serif" font-size="8.5" letter-spacing="1.2" fill="#f5fff9">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">GLOBAL CENTER FOR RESEARCH AND STUDY</textPath>
  </text>
</svg>
